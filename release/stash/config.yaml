# Garasu | Remnawave Stash subscription template.
# Remote Garasu rule sets; cache and first-download required.
# One visible Garasu group; Stash handles url-test internally.
# Never auto-fallback to DIRECT on foreign traffic.
# User nodes are inserted at the two Remnawave anchors below.
mode: rule
log-level: warning
allow-lan: false
ipv6: false
# Stash sends DNS upstream directly (unlike Mihomo #proxy).
# Never make starting the tunnel depend on overseas DoH in blocked networks.
dns:
  default-nameserver:
    - system
  proxy-server-nameserver:
    - system
  nameserver:
    - system
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: Garasu
    # Remnawave injects every subscriber node at this anchor.
    # Native Stash url-test automatically selects a healthy server.
    type: url-test
    url: https://www.google.com/generate_204
    interval: 180
    tolerance: 150
    lazy: false
    proxies: # LEAVE THIS LINE!
      # An empty Stash group otherwise behaves as DIRECT.
      # Explicit reject protects VPN-only destinations when no nodes exist.
      - REJECT

