# Garasu MAX | Remnawave Mihomo template (not a standalone subscription).
# Import as MIHOMO TEMPLATE in Remnawave; Remnawave injects each user's nodes.
# No Moscow proxy chain. Geo/RKN lists auto-update from Garasu GitHub.
mode: rule
log-level: warning
allow-lan: false
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  # DIRECT destinations should resolve using the local network resolver.
  direct-nameserver:
    - system
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'ntp.*.com'
# Remnawave inserts the subscriber's permitted nodes here.
proxies: # LEAVE THIS LINE!

proxy-groups:
  - name: Garasu
    type: select
    proxies:
      - Garasu Auto
      - DIRECT
    remnawave:
      include-proxies: false
  - name: Garasu Auto
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 150
    include-all: true
    remnawave:
      include-proxies: false
    proxies: # LEAVE THIS LINE!
      # Personal nodes are selected automatically by include-all.
rule-providers:
  rkn-domains:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/rules/rkn-domains.list
    proxy: Garasu Auto
    path: ./rule-providers/garasu-rkn-domains.list
    interval: 21600
