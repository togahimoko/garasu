name: Garasu - real core audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-validation:
    name: Validate with actual Mihomo and sing-box engines
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install strict parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Fetch and validate real upstream data (dry run)
        run: python scripts/refresh.py
      - name: Unit and integration invariants
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic node-injected configs
        run: python scripts/smoke_cores.py --output-dir "$RUNNER_TEMP/garasu-ci"
      - name: 'Stash compatible YAML: Mihomo parser smoke check'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$RUNNER_TEMP/garasu-ci/stash-remnawave.ci.yaml" \
            -d "$RUNNER_TEMP/garasu-ci"
      - name: 'Real Mihomo core v1.19.32: parse and validate'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$RUNNER_TEMP/garasu-ci/mihomo-remnawave.ci.yaml" \
            -d "$RUNNER_TEMP/garasu-ci"
      - name: 'Real sing-box core v1.14.2: parse and validate'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            ghcr.io/sagernet/sing-box:v1.14.2 check \
            -c "$RUNNER_TEMP/garasu-ci/singbox-remnawave-1.14.ci.json"
      - name: 'Real sing-box core v1.14.2: legacy-compatible template'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            ghcr.io/sagernet/sing-box:v1.14.2 check \
            -c "$RUNNER_TEMP/garasu-ci/singbox-remnawave.ci.json"
