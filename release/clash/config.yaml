# Garasu | CLASH (classic) template.
# One automatic group, compatible YAML rule providers.
# Never send Mihomo MRS providers to the classic Clash core.
mode: rule
mixed-port: 7890
allow-lan: false
log-level: warning
ipv6: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 77.88.8.8
    - 1.1.1.1
  nameserver:
    - 77.88.8.8
    - 1.1.1.1

proxies: # LEAVE THIS LINE!

proxy-groups:
  - name: Garasu
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 150
    proxies: # LEAVE THIS LINE!

