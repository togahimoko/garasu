# Garasu Unified v1 CANDIDATE — not activated in Remnawave.
# RU bypass is disabled until complete blocked-registry startup is
# verified on the native client (no fail-open on cold cache).
# Garasu MAX — Stash template for Remnawave, not a direct subscription URL.
# User nodes are inserted at the two Remnawave anchors below.
mode: rule
log-level: warning
allow-lan: false
ipv6: false
dns:
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: Garasu
    # Remnawave injects every subscriber node at this anchor.
    # Native Stash url-test automatically selects a healthy server.
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 150
    lazy: false
    proxies: # LEAVE THIS LINE!
      # An empty Stash group otherwise behaves as DIRECT.
      # Explicit reject protects VPN-only destinations when no nodes exist.
      - REJECT
rule-providers:
  rkn-domains-full:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/eae553c8eea684d96b83de964c949104ee9acc23/rules/unified/refilter-domain-full.list
    path: ./garasu-unified/rkn-domains-full.txt
    interval: 21600
  rkn-ips-full:
    type: http
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/eae553c8eea684d96b83de964c949104ee9acc23/rules/unified/refilter-ip-full.cidr
    path: ./garasu-unified/rkn-ips-full.txt
    interval: 21600
  youtube:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/d5c5b908bac93aaa38203ff46574c0fe2b14bbbc/rules/youtube.list
    path: ./garasu-unified/youtube.txt
    interval: 21600
  discord:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/d5c5b908bac93aaa38203ff46574c0fe2b14bbbc/rules/discord.list
    path: ./garasu-unified/discord.txt
    interval: 21600
  ai:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/d5c5b908bac93aaa38203ff46574c0fe2b14bbbc/rules/ai.list
    path: ./garasu-unified/ai.txt
    interval: 21600
  crypto:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/d5c5b908bac93aaa38203ff46574c0fe2b14bbbc/rules/crypto.list
    path: ./garasu-unified/crypto.txt
    interval: 21600
  proxy:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/d5c5b908bac93aaa38203ff46574c0fe2b14bbbc/rules/proxy.list
    path: ./garasu-unified/proxy.txt
    interval: 21600
  proxy-ips:
    type: http
    behavior: ipcidr
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/d5c5b908bac93aaa38203ff46574c0fe2b14bbbc/rules/proxy-ips.cidr
    path: ./garasu-unified/proxy-ips.txt
    interval: 21600
  ads:
    type: http
    behavior: domain
    format: text
    url: https://raw.githubusercontent.com/togahimoko/garasu/d5c5b908bac93aaa38203ff46574c0fe2b14bbbc/rules/ads.list
    path: ./garasu-unified/ads.txt
    interval: 21600
rules:
  # Local device/network domains must bypass the VPN at first match.
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - RULE-SET,rkn-domains-full,Garasu
  - RULE-SET,rkn-ips-full,Garasu,no-resolve
  - RULE-SET,youtube,Garasu
  - RULE-SET,discord,Garasu
  - RULE-SET,ai,Garasu
  - RULE-SET,crypto,Garasu
  - RULE-SET,proxy,Garasu
  - RULE-SET,proxy-ips,Garasu,no-resolve
  - RULE-SET,ads,REJECT
  - MATCH,Garasu
