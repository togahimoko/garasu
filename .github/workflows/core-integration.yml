name: Garasu - real core integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-validation:
    name: Validate with actual Mihomo and sing-box engines
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 Node24
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 Node24
        with:
          python-version: '3.12'
      - name: Install strict parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Fetch and validate real upstream data (dry run)
        run: python scripts/refresh.py
      - name: Unit and integration invariants
        env:
          GARASU_ALLOW_REFRESHED_CANDIDATE_SKIP: '1'
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic node-injected configs
        run: python scripts/smoke_cores.py --output-dir "$RUNNER_TEMP/garasu-ci"
      - name: Verify empty subscriber pool parses without DIRECT fallback
        env:
          OUT: ${{ runner.temp }}/garasu-empty
        run: |
          mkdir -p "$OUT"
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.smoke_cores import prepare_mihomo
          out = Path(os.environ["OUT"])
          for name in ("mihomo-remnawave.yaml", "stash-remnawave.yaml"):
              prepare_mihomo("clients/canary/" + name, out, node_count=0)
          PY
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v "$OUT:$OUT" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$OUT/mihomo-remnawave.ci.yaml" -d "$OUT"
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v "$OUT:$OUT" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$OUT/stash-remnawave.ci.yaml" -d "$OUT"

      - name: 'Stash compatible YAML: Mihomo parser smoke check'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$RUNNER_TEMP/garasu-ci/stash-remnawave.ci.yaml" \
            -d "$RUNNER_TEMP/garasu-ci"
      - name: 'Real Xray core: validate Garasu GeoIP/GeoSite and advanced routing'
        run: |
          docker run --rm \
            -e "XRAY_LOCATION_ASSET=$GITHUB_WORKSPACE/geo" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            ghcr.io/xtls/xray-core:26.10.21@sha256:447ffc750a0b87d6e4f2c38425f68105bfc8c789e59c22d83b94eb7e1e648c50 run -test \
            -config "$RUNNER_TEMP/garasu-ci/xray-advanced-remnawave.ci.json"
      - name: 'Real Mihomo core v1.19.32: parse and validate'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$RUNNER_TEMP/garasu-ci/mihomo-remnawave.ci.yaml" \
            -d "$RUNNER_TEMP/garasu-ci"
      - name: 'Real sing-box core v1.14.2: parse and validate'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            ghcr.io/sagernet/sing-box:v1.14.2 check \
            -c "$RUNNER_TEMP/garasu-ci/singbox-remnawave-1.14.ci.json"
      - name: Prepare five-node canary and experimental fixtures
        env:
          OUT: ${{ runner.temp }}/garasu-multi
        run: |
          mkdir -p "$OUT"
          python - <<'PY'
          from pathlib import Path
          import os
          from scripts.smoke_cores import prepare_mihomo, prepare_singbox
          out=Path(os.environ["OUT"])
          for name in ("mihomo-remnawave.yaml", "stash-remnawave.yaml"):
              prepare_mihomo("clients/canary/" + name, out, node_count=5)
          prepare_singbox("clients/experimental/singbox-remnawave-1.14-auto.json", out, node_count=5)
          PY
      - name: Real Mihomo core parses 5-node auto pool
        run: |
          docker run --rm -v "$RUNNER_TEMP/garasu-multi:$RUNNER_TEMP/garasu-multi" metacubex/mihomo:v1.19.32 -t -f "$RUNNER_TEMP/garasu-multi/mihomo-remnawave.ci.yaml" -d "$RUNNER_TEMP/garasu-multi"
      - name: Stash-compatible parser checks five-node fail-closed pool
        run: |
          docker run --rm -v "$RUNNER_TEMP/garasu-multi:$RUNNER_TEMP/garasu-multi" metacubex/mihomo:v1.19.32 -t -f "$RUNNER_TEMP/garasu-multi/stash-remnawave.ci.yaml" -d "$RUNNER_TEMP/garasu-multi"
      - name: Experimental sing-box URLTest parses five injected nodes
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v "$RUNNER_TEMP/garasu-multi:$RUNNER_TEMP/garasu-multi" ghcr.io/sagernet/sing-box:v1.14.2 check -c "$RUNNER_TEMP/garasu-multi/singbox-remnawave-1.14-auto.ci.json"
      - name: 'Real sing-box core v1.14.2: legacy-compatible template'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            ghcr.io/sagernet/sing-box:v1.14.2 check \
            -c "$RUNNER_TEMP/garasu-ci/singbox-remnawave.ci.json"
