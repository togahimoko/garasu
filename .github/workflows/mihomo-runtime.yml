name: Garasu - live Mihomo HTTP proxy and latency smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Check subscription candidate invariants
        run: python -m unittest discover -s tests -p 'test_mihomo_proxy_regression.py' -v
      - name: Assert real proxy listener, node selection, HTTP routing, and delay
        run: python scripts/probe_mihomo_runtime.py
