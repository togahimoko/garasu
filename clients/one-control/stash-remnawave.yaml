# Garasu ONE CONTROL | Stash Remnawave template — STAGING ONLY.
# Native MRS rule sets (domain and ipcidr); verified format per Stash docs.
# One visible Garasu group; Stash handles url-test internally.
# Never auto-fallback to DIRECT on foreign traffic.
# User nodes are inserted at the two Remnawave anchors below.
mode: rule
log-level: warning
allow-lan: false
ipv6: false
dns:
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: Garasu
    # Remnawave injects every subscriber node at this anchor.
    # Native Stash url-test automatically selects a healthy server.
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 150
    lazy: false
    proxies: # LEAVE THIS LINE!
      # An empty Stash group otherwise behaves as DIRECT.
      # Explicit reject protects VPN-only destinations when no nodes exist.
      - REJECT
rule-providers:
  rkn-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/rkn-domains.mrs
    path: ./garasu/rkn-domains.mrs
    interval: 21600
  youtube:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/youtube.mrs
    path: ./garasu/youtube.mrs
    interval: 21600
  discord:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/discord.mrs
    path: ./garasu/discord.mrs
    interval: 21600
  ai:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/ai.mrs
    path: ./garasu/ai.mrs
    interval: 21600
  crypto:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/crypto.mrs
    path: ./garasu/crypto.mrs
    interval: 21600
  proxy:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/proxy.mrs
    path: ./garasu/proxy.mrs
    interval: 21600
  ads:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/ads.mrs
    path: ./garasu/ads.mrs
    interval: 21600
  games:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/games.mrs
    path: ./garasu/games.mrs
    interval: 21600
  direct:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/direct.mrs
    path: ./garasu/direct.mrs
    interval: 21600
  rkn-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/rkn-ips.mrs
    path: ./garasu/rkn-ips.mrs
    interval: 21600
  proxy-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/proxy-ips.mrs
    path: ./garasu/proxy-ips.mrs
