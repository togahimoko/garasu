  direct-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/direct-ips.mrs
    path: ./garasu/direct-ips.mrs
    interval: 21600
  ru-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/garasu-one-control-20261104/rules/mrs/ru-ips.mrs
    path: ./garasu/ru-ips.mrs
    interval: 21600
rules:
  # Local device/network domains must bypass the VPN at first match.
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - RULE-SET,rkn-domains,Garasu
  - RULE-SET,rkn-ips,Garasu
  - RULE-SET,youtube,Garasu
  - RULE-SET,discord,Garasu
  - RULE-SET,ai,Garasu
  - RULE-SET,crypto,Garasu
  - RULE-SET,proxy,Garasu
  - RULE-SET,proxy-ips,Garasu
  - RULE-SET,ads,REJECT
  - GEOIP,LAN,DIRECT,no-resolve
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,su,DIRECT
  - DOMAIN-SUFFIX,moscow,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - DOMAIN-SUFFIX,xn--p1acf,DIRECT
  - DOMAIN-SUFFIX,xn--80asehdb,DIRECT
  - DOMAIN-SUFFIX,xn--c1avg,DIRECT
  - DOMAIN-SUFFIX,xn--80aswg,DIRECT
  - DOMAIN-SUFFIX,xn--80adxhks,DIRECT
  - DOMAIN-SUFFIX,xn--d1acj3b,DIRECT
  - RULE-SET,ru-ips,DIRECT,no-resolve
  - MATCH,Garasu
