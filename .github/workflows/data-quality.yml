name: Garasu - data quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Build full Garasu release with quality reports (no publish)
        run: python scripts/refresh.py
      - name: Test Garasu data analyzer and existing routing
        run: python -m unittest discover -s tests -v
      - name: Check deterministic report and tracked version when present
        run: |
          python scripts/audit_rules.py --root . --check
          if git ls-files --error-unmatch reports/quality.json >/dev/null 2>&1; then
            git diff --exit-code -- reports/quality.json reports/quality.md
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: garasu-rule-quality
          path: reports/quality.*
          if-no-files-found: error
