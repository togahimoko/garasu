name: Garasu - refresh routing
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'clients/**'
      - 'tests/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: garasu-routing-refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 Node24
        with:
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 Node24
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Check static profiles and builder
        run: python -m unittest discover -s tests -v
      - name: Download and validate full routing datasets
        run: python scripts/refresh.py
      - name: Verify generated output
        run: |
          test -s geo/geoip.dat
          test -s geo/geosite.dat
          test -s rules/rkn-domains.list
          test -s rules/rkn-ips.list
          test -s rules/rkn-ips.cidr
          test -s install/links.json
          python -m unittest discover -s tests -v
      - name: Generate synthetic node-injected profiles
        run: python scripts/smoke_cores.py --output-dir "$RUNNER_TEMP/garasu-ci"
      - name: Validate Mihomo in real core (v1.19.32)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$RUNNER_TEMP/garasu-ci/mihomo-remnawave.ci.yaml" \
            -d "$RUNNER_TEMP/garasu-ci"
      - name: Validate Stash YAML using Mihomo parser
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$RUNNER_TEMP/garasu-ci/stash-remnawave.ci.yaml" \
            -d "$RUNNER_TEMP/garasu-ci"
      - name: Validate sing-box 1.14+ profile in real core
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            ghcr.io/sagernet/sing-box:v1.14.2 check \
            -c "$RUNNER_TEMP/garasu-ci/singbox-remnawave-1.14.ci.json"
      - name: Validate legacy-compatible sing-box profile in real core
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            ghcr.io/sagernet/sing-box:v1.14.2 check \
            -c "$RUNNER_TEMP/garasu-ci/singbox-remnawave.ci.json"
      - name: 'Real Xray core: validate Garasu GeoIP/GeoSite and advanced routing'
        run: |
          docker run --rm \
            -e "XRAY_LOCATION_ASSET=$GITHUB_WORKSPACE/geo" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-ci:$RUNNER_TEMP/garasu-ci" \
            ghcr.io/xtls/xray-core:26.10.21@sha256:447ffc750a0b87d6e4f2c38425f68105bfc8c789e59c22d83b94eb7e1e648c50 run -test \
            -config "$RUNNER_TEMP/garasu-ci/xray-advanced-remnawave.ci.json"
      - name: Publish only complete validated build
        run: |
          git config user.name 'garasu-routing-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/ geo/ clients/ install/
          if git diff --cached --quiet; then
            echo "No changes: keeping last validated release."
          else
            git commit -m "chore: refresh validated Garasu MAX routing data"
            # Fail closed if main moved during the build. The latest push
            # has its own queued run; never publish stale tested artifacts.
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
              echo "Main advanced during build; skipping stale publication."
              exit 0
            fi
            git push origin HEAD:main
          fi
