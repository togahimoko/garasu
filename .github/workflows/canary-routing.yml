name: Garasu - canary policy validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify all existing and canary rules
        # Historical immutable assets are checked strictly in the unified gate;
        # current-main geodata may already have advanced from the old lock.
        env:
          GARASU_ALLOW_REFRESHED_CANDIDATE_SKIP: '1'
        run: python -m unittest discover -s tests -v
      - name: Generate credential-free canary fixtures
        env:
          OUT: ${{ runner.temp }}/garasu-canary
        run: |
          mkdir -p "$OUT"
          python - <<'PY'
          from pathlib import Path
          import os
          from scripts import smoke_cores
          out=Path(os.environ["OUT"])
          for name in ("mihomo-remnawave.yaml","stash-remnawave.yaml"):
              print(smoke_cores.prepare_mihomo("clients/canary/"+name,out))
          print(smoke_cores.prepare_singbox(
              "clients/canary/singbox-remnawave-1.14.json",out))
          PY
      - name: Real Mihomo validation of canary profile
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-canary:$RUNNER_TEMP/garasu-canary" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$RUNNER_TEMP/garasu-canary/mihomo-remnawave.ci.yaml" \
            -d "$RUNNER_TEMP/garasu-canary"
      - name: Stash YAML compatibility via Mihomo parser
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-canary:$RUNNER_TEMP/garasu-canary" \
            metacubex/mihomo:v1.19.32 -t \
            -f "$RUNNER_TEMP/garasu-canary/stash-remnawave.ci.yaml" \
            -d "$RUNNER_TEMP/garasu-canary"
      - name: Real sing-box parser check for opt-in canary
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP/garasu-canary:$RUNNER_TEMP/garasu-canary" \
            ghcr.io/sagernet/sing-box:v1.14.2 check \
            -c "$RUNNER_TEMP/garasu-canary/singbox-remnawave-1.14.ci.json"
