# Garasu | Remnawave Mihomo subscription template.
# One automatic Garasu route; no manual selectors.
# Subscriber nodes are injected by Remnawave, not committed to GitHub.
# TUN lifecycle belongs to the client GUI: never force-toggle an existing session.
# Import as MIHOMO TEMPLATE in Remnawave; Remnawave injects each user's nodes.
# No Moscow chain. Rules downloaded from canonical Garasu GitHub providers.
mode: rule
# Clash Verge Rev default local HTTP/SOCKS listener. The GUI system proxy
# must point to this same port; change it there if already occupied.
mixed-port: 7897
log-level: warning
allow-lan: false
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  # Resolve Remnawave-provided node endpoints without depending on proxy DoH bootstrap.
  # Bootstrap uses the system resolver; verify on actual client networks.
  proxy-server-nameserver:
    - system
  # DIRECT destinations should resolve using the local network resolver.
  direct-nameserver:
    - system
  fake-ip-filter:
    # Resolve local network names normally, never use fake-ip here.
    - 'localhost'
    - '*.localhost'
    - 'home.arpa'
    - '*.home.arpa'
    - 'lan'
    - '*.lan'
    - 'local'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'ntp.*.com'
# Remnawave inserts the subscriber's permitted nodes here.
proxies: # LEAVE THIS LINE!

proxy-groups:
  # One automatic route for any number of available nodes. No manual selectors.
  - name: Garasu
    type: url-test
    url: https://www.google.com/generate_204
    interval: 180
    tolerance: 150
    lazy: false
    timeout: 8000
    max-failed-times: 2
    expected-status: 204
    empty-fallback: REJECT
    proxies: # LEAVE THIS LINE!
      # All available nodes are selected automatically.

