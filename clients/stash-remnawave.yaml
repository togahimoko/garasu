# Garasu | Remnawave Stash subscription template.
# Remote Garasu rule sets; cache and first-download required.
# One visible Garasu group; Stash handles url-test internally.
# Never auto-fallback to DIRECT on foreign traffic.
# User nodes are inserted at the two Remnawave anchors below.
mode: rule
log-level: warning
allow-lan: false
ipv6: false
dns:
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
proxies: # LEAVE THIS LINE!
proxy-groups:
  - name: Garasu
    # Remnawave injects every subscriber node at this anchor.
    # Native Stash url-test automatically selects a healthy server.
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 180
    tolerance: 150
    lazy: false
    proxies: # LEAVE THIS LINE!
      # An empty Stash group otherwise behaves as DIRECT.
      # Explicit reject protects VPN-only destinations when no nodes exist.
      - REJECT

rule-providers:
  ads:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/ads.mrs
    interval: 21600
    path: ./rule-providers/garasu-ads.mrs
  rkn-domains:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/rkn-domains.mrs
    interval: 21600
    path: ./rule-providers/garasu-rkn-domains.mrs
  rkn-ips:
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/rkn-ips.mrs
    interval: 21600
    path: ./rule-providers/garasu-rkn-ips.mrs
  proxy-ips:
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/proxy-ips.mrs
    interval: 21600
    path: ./rule-providers/garasu-proxy-ips.mrs
  ru-ips:
    behavior: ipcidr
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/ru-ips.mrs
    interval: 21600
    path: ./rule-providers/garasu-ru-ips.mrs
  youtube:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/youtube.mrs
    interval: 21600
    path: ./rule-providers/garasu-youtube.mrs
  discord:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/discord.mrs
    interval: 21600
    path: ./rule-providers/garasu-discord.mrs
  ai:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/ai.mrs
    interval: 21600
    path: ./rule-providers/garasu-ai.mrs
  crypto:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/crypto.mrs
    interval: 21600
    path: ./rule-providers/garasu-crypto.mrs
  proxy:
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/togahimoko/garasu/main/release/mihomo/.mrs/proxy.mrs
    interval: 21600
    path: ./rule-providers/garasu-proxy.mrs

rules:
  # GARASU SPLIT: remote RKN before RU, foreign -> VPN.
  - DOMAIN-SUFFIX,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - DOMAIN-SUFFIX,arpa,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,ads,REJECT
  - RULE-SET,rkn-domains,Garasu
  - RULE-SET,youtube,Garasu
  - RULE-SET,discord,Garasu
  - RULE-SET,ai,Garasu
  - RULE-SET,crypto,Garasu
  - RULE-SET,proxy,Garasu
  - RULE-SET,rkn-ips,Garasu,no-resolve
  - RULE-SET,proxy-ips,Garasu,no-resolve
  - DOMAIN-SUFFIX,2gis.ru,DIRECT
  - DOMAIN-SUFFIX,alfabank.ru,DIRECT
  - DOMAIN-SUFFIX,avito.ru,DIRECT
  - DOMAIN-SUFFIX,cbr.ru,DIRECT
  - DOMAIN-SUFFIX,gosuslugi.ru,DIRECT
  - DOMAIN-SUFFIX,nalog.gov.ru,DIRECT
  - DOMAIN-SUFFIX,ozon.ru,DIRECT
  - DOMAIN-SUFFIX,pochta.ru,DIRECT
  - DOMAIN-SUFFIX,sber.ru,DIRECT
  - DOMAIN-SUFFIX,sberbank.ru,DIRECT
  - DOMAIN-SUFFIX,tbank.ru,DIRECT
  - DOMAIN-SUFFIX,tinkoff.ru,DIRECT
  - DOMAIN-SUFFIX,vk.com,DIRECT
  - DOMAIN-SUFFIX,vtb.ru,DIRECT
  - DOMAIN-SUFFIX,wildberries.ru,DIRECT
  - DOMAIN-SUFFIX,ya.ru,DIRECT
  - DOMAIN-SUFFIX,yandex.ru,DIRECT
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,su,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - DOMAIN-SUFFIX,xn--p1acf,DIRECT
  - DOMAIN-SUFFIX,moscow,DIRECT
  - DOMAIN-SUFFIX,xn--80asehdb,DIRECT
  - DOMAIN-SUFFIX,xn--c1avg,DIRECT
  - DOMAIN-SUFFIX,xn--80aswg,DIRECT
  - DOMAIN-SUFFIX,xn--80adxhks,DIRECT
  - DOMAIN-SUFFIX,xn--d1acj3b,DIRECT
  - RULE-SET,ru-ips,DIRECT,no-resolve
  - MATCH,Garasu
