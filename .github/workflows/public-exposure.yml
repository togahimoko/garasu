name: Garasu - public exposure audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - 'install/**'
      - 'docs/**'
      - 'README.md'
      - 'scripts/audit_public_exposure.py'
      - 'tests/test_public_exposure.py'
      - '.github/workflows/public-exposure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Run Garasu public exposure regression checks
        run: python -m unittest discover -s tests -p 'test_public_exposure.py' -v
      - name: Scan publicly delivered configuration files
        run: python scripts/audit_public_exposure.py
