name: Garasu - refresh routing
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'clients/**'
      - 'tests/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: garasu-routing-refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: true
          # Required to verify pinned release assets at their historical commits
          # after main's scheduled geodata updates.
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Verify immutable source-release blobs in Git history
        run: python -m scripts.verify_unified_git_objects
      - name: Check static profiles and builder
        # main may legitimately contain newer geo/rules after a prior refresh.
        # Immutable historical blobs are verified strictly in the step above.
        env:
          GARASU_ALLOW_REFRESHED_CANDIDATE_SKIP: '1'
        run: python -m unittest discover -s tests -v
      - name: Download and validate full routing datasets
        run: python scripts/refresh.py
      - name: Verify generated output
        # A successful rolling refresh legitimately changes geo/ and rules/.
        # The entire suite runs above on the immutable clean checkout; only
        # its snapshot-specific tests skip here after the external data update.
        # Rule quality and all non-pinned routing tests still run below.
        env:
          GARASU_ALLOW_REFRESHED_CANDIDATE_SKIP: '1'
        run: |
          test -s geo/geoip.dat
          test -s geo/geosite.dat
          test -s rules/rkn-domains.list
          test -s rules/rkn-ips.list
          test -s rules/rkn-ips.cidr
          test -s install/links.json
          test -s reports/quality.json
          test -s reports/quality.md
          python scripts/audit_rules.py --root . --check
          python -m unittest discover -s tests -v
      - name: Publish only complete validated build
        run: |
          git config user.name 'garasu-routing-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules/ geo/ clients/ install/ reports/
          if git diff --cached --quiet; then
            echo "No changes: keeping last validated release."
          else
            git commit -m "chore: refresh validated Garasu MAX routing data"
            # Fail closed if main moved during the build. The latest push
            # has its own queued run; never publish stale tested artifacts.
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
              echo "Main advanced during build; skipping stale publication."
              exit 0
            fi
            git push origin HEAD:main
          fi
