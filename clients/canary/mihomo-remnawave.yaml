# Garasu MAX | Remnawave Mihomo template (not a standalone subscription).
# Import as MIHOMO TEMPLATE in Remnawave; Remnawave injects each user's nodes.
# No Moscow proxy chain. Geo/RKN lists auto-update from Garasu GitHub.
mode: rule
# Clash Verge Rev default local HTTP/SOCKS listener. The GUI system proxy
# must point to this same port; change it there if already occupied.
mixed-port: 7897
log-level: warning
allow-lan: false
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: false
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  # Resolve the single Remnawave node without depending on proxy DoH bootstrap.
  # This is a canary fallback to the local system resolver; test on real ISPs.
  proxy-server-nameserver:
    - system
  # DIRECT destinations should resolve using the local network resolver.
  direct-nameserver:
    - system
  fake-ip-filter:
    # Resolve local network names normally, never use fake-ip here.
    - 'localhost'
    - '*.localhost'
    - 'home.arpa'
    - '*.home.arpa'
    - 'lan'
    - '*.lan'
    - 'local'
    - '*.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'time.*.com'
    - 'ntp.*.com'
# Remnawave inserts the subscriber's permitted nodes here.
proxies: # LEAVE THIS LINE!

proxy-groups:
  - name: Garasu
    type: select
    proxies:
      - Garasu Auto
    remnawave:
      include-proxies: false
  - name: Garasu Auto
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 150
    lazy: false
    timeout: 8000
    include-all: true
    remnawave:
      include-proxies: false
    proxies: # LEAVE THIS LINE!
      # Personal nodes are selected automatically by include-all.
rule-providers:
